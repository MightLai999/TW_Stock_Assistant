name: 每日自動更新台股資料

on:
  schedule:
    # GitHub Actions 使用 UTC 時間
    # 台灣時間 (UTC+8) 週一至週五 16:30 相當於 UTC 08:30 (收盤並結算完成後抓取)
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊按鈕立即執行

permissions:
  contents: write

jobs:
  update-stocks-data:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案原始碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行台股資料抓取引擎
        run: |
          python fetch_stocks.py

      - name: 提交並推送更新後的資料回專案庫
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stocks.json stocks_meta.json stocks_data.js public/stocks.json public/stocks_meta.json cache/
          git diff --staged --quiet || (git commit -m "自動排程更新: 台股收盤行情與殖利率資料 [skip ci]" && git push)
